<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — LTM Security Platform</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='LTM_LOGO.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v=7">
</head>
<body>
    <div class="auth-scene">
        <div class="auth-bg-photo"></div>
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>
        <div class="auth-orb auth-orb-3"></div>
    </div>

    <main class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="auth-logo"><img src="{{ url_for('static', filename='LTM_LOGO.png') }}" alt="LTM Security Platform"></span>
                <div class="auth-brand-text">
                    <span class="auth-title">LTM Security</span>
                    <span class="auth-sub">Platform</span>
                </div>
            </div>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            {% if notice %}
            <div class="auth-notice">{{ notice }}</div>
            {% endif %}

            {% if authenticated_user %}
            <div class="auth-signedin">
                <div class="auth-signedin-body">
                    <strong>You are already signed in</strong>
                    <span>{{ authenticated_user.name }} &middot; {{ authenticated_user.role }}</span>
                </div>
                <div class="auth-signedin-actions">
                    <a href="{{ url_for('system_info') }}" class="auth-link">Go to Dashboard</a>
                    <a href="{{ url_for('logout') }}" class="auth-link auth-link-muted">Sign out</a>
                </div>
            </div>
            {% endif %}

            <form class="auth-form" id="loginForm" method="POST" action="{{ url_for('login', next=next_url) if next_url else url_for('login') }}">
                <label class="auth-field">
                    <span>Email</span>
                    <input type="email" name="email" placeholder="you@company.com" required autocomplete="email" value="{{ form.email if form else '' }}">
                </label>
                <label class="auth-field">
                    <span>Password</span>
                    <input type="password" name="password" placeholder="Your password" required autocomplete="current-password">
                </label>
                <button type="submit" class="auth-submit">Sign in</button>
            </form>
        </div>
    </main>
</body>
</html>
